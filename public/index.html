<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#09110d">

    <title>Ripetizioni</title>

    <link rel="icon" type="image/png" href="/img/icona-semaforo.png">
    <link rel="apple-touch-icon" href="/img/icona-semaforo.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/img/icona-semaforo-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/img/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Disponibilità">

    <link rel="stylesheet" href="/styles.css">
  </head>

  <body class="status-page state-loading">
    <main class="status-shell" aria-live="polite" aria-busy="true">
      <h1 id="status-title" class="status-title">CARICAMENTO…</h1>

      <img
        id="traffic-light"
        class="traffic-light"
        src="/img/semaforo-spento.svg"
        alt="Semaforo in caricamento"
        width="360"
        height="560"
      >

      <section class="status-detail" aria-label="Dettaglio disponibilità">
        <p id="status-line" class="status-line" hidden>
          <span id="status-label"></span>
          <strong id="status-time"></strong>
        </p>

        <p id="status-relative" class="status-relative">
          Aggiornamento in corso
        </p>
      </section>

      <p id="updated-at" class="updated-at"></p>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
